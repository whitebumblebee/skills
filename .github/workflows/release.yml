name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # With pending changesets: opens or updates the "chore: version skills"
      # pull request. With none — right after that pull request is merged — it
      # tags the new version and creates its GitHub release.
      - name: Version pull request, or tag and release
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset tag
          commit: "chore: version skills"
          title: "chore: version skills"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
